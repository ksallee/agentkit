# Rule 17's gates. `bin/verify` runs everything `.agentkit/gates.toml`
# declares, so no gate is named here and changing the gate list needs no edit
# to this file.
#
# One step, and the per-gate result goes to the run summary. A step per gate
# holds the gate names in a second file. That copy is what made this file
# unseedable: `bin/adopt` renders a project's workflow once, the project owns
# its gate list, and a step naming `probes` fails in a project that declares
# none.
#
# `bin/adopt` renders the seeded equivalent, and `tests/test_gates.py` checks
# that both name no gate.

name: Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  # Cancel only where a newer run genuinely supersedes an older one, which is a
  # new commit. A label change does not: it fires `labeled`, the run started by
  # `opened` seconds earlier dies, and a cancelled run prints as `fail` with no
  # failing step. 105 of 300 runs here were cancelled that way before #189, and
  # `gh pr create --label` does not avoid it: it fires one `labeled` per label
  # on top of `opened`, measured on this pull request.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.action == 'synchronize' }}

jobs:
  gates:
    name: Every gate in .agentkit/gates.toml
    runs-on: [self-hosted, agentkit-local]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: bin/verify

  preflight:
    name: A dead runner is a red check
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
    steps:
      # The runners API wants the administration scope, which this token
      # never has, so the check is indirect: wait for this run's own gates
      # job to leave `queued`. A live runner claims it in seconds.
      - run: |
          for _ in $(seq 12); do
            sleep 10
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("Every gate")) | .status] | first')
            if [ -n "$status" ] && [ "$status" != "queued" ]; then exit 0; fi
          done
          echo "::error::No runner labelled agentkit-local took the gates job within two minutes, so the runner is offline. .agentkit/team.md names the machine that carries it. Start it, then re-run the failed jobs."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
