# Rule 17's gates. `bin/verify` runs everything `.agentkit/gates.toml`
# declares, so no gate is named here and changing the gate list needs no edit
# to this file.
#
# One step, and the per-gate result goes to the run summary. A step per gate
# holds the gate names in a second file. That copy is what made this file
# unseedable: `bin/adopt` renders a project's workflow once, the project owns
# its gate list, and a step naming `probes` fails in a project that declares
# none.
#
# `bin/adopt` renders the seeded equivalent, and `tests/test_gates.py` checks
# that both name no gate.

name: Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  # Cancel only where a newer run genuinely supersedes an older one, which is a
  # new commit. A label change does not: it fires `labeled`, the run started by
  # `opened` seconds earlier dies, and a cancelled run prints as `fail` with no
  # failing step. 105 of 300 runs here were cancelled that way before #189, and
  # `gh pr create --label` does not avoid it: it fires one `labeled` per label
  # on top of `opened`, measured on this pull request.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event.action == 'synchronize' }}

jobs:
  gates:
    name: Every gate in .agentkit/gates.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: bin/verify
