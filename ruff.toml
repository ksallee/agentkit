# The lint rules, here and in every project seeded from a python pack.
# `seeds.json` names this file under `per_pack`, so a project owns its copy and
# a rerun keeps an edit to it as `ruff.toml.local`, the way it keeps any seeded
# file's.
#
# It travels with the command that reads it, and with no other pack. The python
# packs declare `uvx ruff check .`, and ruff with no config in reach applies its
# own default set, which is broader than this one and is whatever the installed
# version has decided it is. A project seeded without this file points that set
# at files agentkit wrote and cannot be asked to fix (#108). A node project
# declares no such command, so it receives no config for one (#112).
#
# The selection is the one mac-hours uses, so code moving between the two is
# judged once. A `ruff.toml` and not a `pyproject.toml`, because neither this
# template nor a freshly seeded project has anything to build or install. A
# project that packages itself moves these keys into its own `pyproject.toml`.

line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

# `bin/` holds executables with no `.py` suffix, and ruff walks a directory by
# extension. Without this the lint gate reports "No Python files found" and
# passes. A seeded project has the same `bin/` entries, so the line carries.
extend-include = ["bin/*"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length: the comments are the point, and many are prose
    "SIM108", # ternaries are not always clearer than an if/else
]

# `bin/` holds two kinds of executable and `target-version` cannot tell them
# apart. `bin/verify` and `bin/check-process` ask uv for an interpreter and may
# use anything. The rest carry `#!/usr/bin/env python3` and run on whatever the
# machine has, which on a stock macOS is 3.9.
#
# UP017 rewrites `datetime.now(timezone.utc)` to `datetime.now(UTC)`, and that
# alias arrived in 3.11. It is how #111 happened: the config told the code it
# could use an API the shebang cannot promise, and `bin/adopt` then failed on
# the first command the README gives a new adopter. `tests/test_interpreter.py`
# asserts the floor those scripts actually hold to.
[lint.per-file-ignores]
"bin/*" = ["UP017"]
